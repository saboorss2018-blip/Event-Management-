<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

<header class="navbar">
    <div class="logo">🎟️ Event<span>Hub</span></div>

    <nav>
        <a href="index.html">Home</a>
        <a href="register.html" class="nav-register">Register</a>
    </nav>
</header>

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-icon">👋</div>

        <h1>Welcome Back!</h1>
        <p class="auth-subtitle">Login to manage your events and bookings.</p>

        <form id="loginForm">

            <label>Email Address</label>
            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required
            >

            <button type="submit" class="btn primary-btn full-btn">
                🔐 Login
            </button>

        </form>

        <div id="loginMessage"></div>

        <p class="auth-bottom">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </p>

    </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
